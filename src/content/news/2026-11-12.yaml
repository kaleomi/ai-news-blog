items:
  - title: 美联航限制 AI 智能体代客订票
    category: 动态
    summary: 美联航以数据安全和合规为由，限制未经授权的 AI 智能体访问其平台，担心出现未授权交易和里程被盗用。智能体替人办事，开始撞上平台方的门槛。
    url: https://riorundown.substack.com/p/ai-news-nov-12-2026-ai-agents-infrastructure
    source: 路透社报道，RIO Rundown 汇总
  - title: Anthropic 称 Mythos 三天把 Claude 移植到 AMD GPU
    category: 动态
    summary: 说法出自 Anthropic 的投资者材料：模型自己写了几乎全部底层内核，Claude 现在能跑在四大芯片家族上。目前没有第三方验证，先当作一个信号看。
    url: https://riorundown.substack.com/p/ai-news-nov-12-2026-ai-agents-infrastructure
    source: The Decoder 报道，RIO Rundown 汇总
  - title: AWS 放出一个由 AI 智能体写成的本地模拟器
    category: 产品
    summary: AWS Emulator 覆盖 200 多项服务，不需要 AWS 账号就能在本地跑。代码由三组分工明确的智能体完成：写测试、找问题、修问题。
    url: https://riorundown.substack.com/p/ai-news-nov-12-2026-ai-agents-infrastructure
    source: Unite.AI 报道，RIO Rundown 汇总
  - title: MIT 做出更省数据的 AI 气候模拟器
    category: 研究
    summary: 新方法需要的训练数据更少，还能预测训练时没见过的情景，论文发表在 PNAS。
    url: https://news.mit.edu/2026/new-research-could-lead-faster-trustworthy-ai-models-climate-prediction-1112
    source: MIT News
  - title: 助手、Copilot、智能体到底怎么分，各自什么时候用
    category: 文章
    summary: 按「行为」而不是按名字来区分三类产品，适合正在选型的团队读一遍。
    url: https://towardsdatascience.com/ai-assistant-vs-copilot-vs-agent-and-when-to-use-each
    source: Towards Data Science
