items:
  - title: 谷歌向公众发布 Gemini 4 Carbon
    category: 产品
    summary: 谷歌称这是旗下迄今最强的模型，面向复杂、长周期任务。10 月底它只对部分网络安全防御人员开放，北京时间 11 月 11 日起正式公开。
    url: http://finance.sina.com.cn/jjxw/2026-11-11/doc-iniyixxy2014982.shtml
    source: 新浪财经
  - title: 谷歌推出 Gemini Decisions API：只给概率，不生成文字
    category: 产品
    summary: 背后是新模型 Gemini Decision 1，一次可以针对同一份多模态输入回答最多 1000 个判断题，返回校准过的概率。适合审核、分类、路由这类高频判断。
    url: https://blog.google/innovation-and-ai/technology/developers-tools/gemini-decisions-api/
    source: Google 官方博客
  - title: DeepMind 发布 AlphaGenome 2
    category: 研究
    summary: 新版本能预测基因变异在不同细胞类型里的影响，目前通过非商业 API 提供，权重要等论文正式发表后再放出。
    url: https://www.marktechpost.com/2026/11/11/google-deepmind-alphagenome-2-cell-type-variant-effects
    source: MarkTechPost
  - title: 百度发布 ERNIE 5.5 Flash Preview，称权重将开源
    category: 产品
    summary: 总参数 280B、激活参数 14B，上下文 1M token。API 已上线千帆，官方表示权重之后会以 Apache 2.0 协议开源。
    url: https://ernie.baidu.com/release/ernie-5-5-flash-preview/
    source: 百度
  - title: AI 训练数据公司 Mercor 完成 7.5 亿美元 D 轮融资
    category: 动态
    summary: 英伟达、Zoom、Benchmark 等参投。给大模型公司供数据的「数据工厂」，仍然是资本愿意下重注的环节。
    url: https://k.sina.com.cn/article_7857201856_1d45362c001908uhbc.html
    source: 智东西，新浪汇总
  - title: 北京印发具身智能机器人三年行动方案
    category: 动态
    summary: 《北京市具身智能机器人产业高质量发展行动方案（2026—2028年）》11 月 11 日印发。
    url: https://k.sina.cn/article_7857201856_1d45362c001908uh7s.html
    source: 新浪汇总
